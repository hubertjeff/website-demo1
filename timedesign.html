<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stopwatch Timer Clock</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 90%;
      max-width: 700px;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
    }

    h1 {
      margin-bottom: 25px;
    }

    .box {
      margin: 25px 0;
      padding: 20px;
      border-radius: 10px;
      background: #f8f9fa;
    }

    .display {
      font-size: 42px;
      font-weight: bold;
      margin: 15px 0;
    }

    button {
      padding: 10px 16px;
      margin: 5px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 15px;
      color: white;
    }

    .start {
      background: #28a745;
    }

    .stop {
      background: #dc3545;
    }

    .reset {
      background: #6c757d;
    }

    input {
      padding: 10px;
      width: 80px;
      font-size: 16px;
      text-align: center;
      margin: 5px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Welcome</h1>

    <!-- Clock -->
    <div class="box">
      <h2>Clock</h2>
      <div id="clock" class="display">00:00:00</div>
    </div>

    <!-- Stopwatch -->
    <div class="box">
      <h2>Stopwatch</h2>
      <div id="stopwatch" class="display">00:00:00</div>

      <button class="start" onclick="startStopwatch()">Start</button>
      <button class="stop" onclick="stopStopwatch()">Stop</button>
      <button class="reset" onclick="resetStopwatch()">Reset</button>
    </div>

    <!-- Countdown Timer -->
    <div class="box">
      <h2>Countdown Timer</h2>

      <input type="number" id="minutesInput" placeholder="Min" min="0">
      <input type="number" id="secondsInput" placeholder="Sec" min="0">

      <div id="timer" class="display">00:00</div>

      <button class="start" onclick="startTimer()">Start</button>
      <button class="stop" onclick="stopTimer()">Stop</button>
      <button class="reset" onclick="resetTimer()">Reset</button>
    </div>
  </div>

  <script>
    // Clock
    function updateClock() {
      const now = new Date();

      const hours = String(now.getHours()).padStart(2, "0");
      const minutes = String(now.getMinutes()).padStart(2, "0");
      const seconds = String(now.getSeconds()).padStart(2, "0");

      document.getElementById("clock").textContent =
        `${hours}:${minutes}:${seconds}`;
    }

    setInterval(updateClock, 1000);
    updateClock();

    // Stopwatch
    let stopwatchSeconds = 0;
    let stopwatchInterval = null;

    function updateStopwatch() {
      const hours = Math.floor(stopwatchSeconds / 3600);
      const minutes = Math.floor((stopwatchSeconds % 3600) / 60);
      const seconds = stopwatchSeconds % 60;

      document.getElementById("stopwatch").textContent =
        String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function startStopwatch() {
      if (stopwatchInterval !== null) return;

      stopwatchInterval = setInterval(() => {
        stopwatchSeconds++;
        updateStopwatch();
      }, 1000);
    }

    function stopStopwatch() {
      clearInterval(stopwatchInterval);
      stopwatchInterval = null;
    }

    function resetStopwatch() {
      stopStopwatch();
      stopwatchSeconds = 0;
      updateStopwatch();
    }

    // Countdown Timer
    let timerSeconds = 0;
    let timerInterval = null;

    function updateTimerDisplay() {
      const minutes = Math.floor(timerSeconds / 60);
      const seconds = timerSeconds % 60;

      document.getElementById("timer").textContent =
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");
    }

    function startTimer() {
      if (timerInterval !== null) return;

      if (timerSeconds === 0) {
        const mins = Number(document.getElementById("minutesInput").value) || 0;
        const secs = Number(document.getElementById("secondsInput").value) || 0;

        timerSeconds = mins * 60 + secs;
        updateTimerDisplay();
      }

      if (timerSeconds <= 0) return;

      timerInterval = setInterval(() => {
        timerSeconds--;
        updateTimerDisplay();

        if (timerSeconds <= 0) {
          stopTimer();
          alert("Time is up!");
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      stopTimer();
      timerSeconds = 0;
      document.getElementById("minutesInput").value = "";
      document.getElementById("secondsInput").value = "";
      updateTimerDisplay();
    }
  </script>

</body>
</html>
